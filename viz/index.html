<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>2000 TRACES — Collective Record</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ground: #0a0b0e; --panel: rgba(17, 19, 25, .82); --line: #232833;
    --ink: #d8dbe2; --dim: #79808c; --accent: #d9b45b;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  #c { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #hud { font: 13px/1.5 var(--mono); color: var(--ink); }
  #hud.hidden .panel, #hud.hidden + #zoneLabels { display: none; }
  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 10px;
  }
  .panel.top { top: 16px; left: 16px; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 340px; }
  .brand { letter-spacing: .14em; font-weight: 700; }
  .dim { color: var(--dim); }
  .panel.transport { bottom: 16px; left: 50%; transform: translateX(-50%); }
  .panel.seat { top: 16px; right: 16px; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 200px; }
  .panel.seat .pid { font-size: 22px; color: var(--accent); letter-spacing: .08em; }
  .panel.help { bottom: 16px; left: 16px; font-size: 11px; border: none; background: none; padding: 0; }
  button, select, input[type="range"] {
    background: #10131a; border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #scrub { width: 260px; padding: 0; accent-color: var(--accent); }
  .mono { font-variant-numeric: tabular-nums; min-width: 52px; display: inline-block; }
  #zoneLabels { position: fixed; inset: 0; pointer-events: none; }
  #zoneLabels .zl {
    position: absolute; top: 0; left: 0; color: var(--dim);
    font: 10px/1 var(--mono); letter-spacing: .1em;
    transform-origin: 0 0; transition: opacity .2s; margin: -5px 0 0 6px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
