<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <meta name="description" content="2000 TRACES — Cosmic Symphony. Birlikte üretilen seslerin, hareketlerin ve anların yaşayan atlası.">
  <title>2000 TRACES — Cosmic Symphony</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050b12'/%3E%3Ccircle cx='32' cy='32' r='19' stroke='%2399c9db' fill='none'/%3E%3Ccircle cx='32' cy='32' r='10' stroke='%2399c9db' fill='none'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23f4eee6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <canvas id="c" aria-label="Katılımcıların ses ve hareket izlerinden oluşan etkileşimli evren"></canvas>
  <noscript>2000 TRACES deneyimini görüntülemek için JavaScript'i etkinleştirin.</noscript>
  <script type="module">
    import('/src/main.js').catch((error) => {
      const panel = document.createElement('section');
      panel.className = 'startup-fallback';
      panel.setAttribute('role', 'alert');
      const brand = document.createElement('p');
      brand.className = 'eyebrow';
      brand.textContent = '2000 TRACES · COSMIC SYMPHONY';
      const title = document.createElement('h1');
      title.textContent = 'Evren henüz açılamadı.';
      const copy = document.createElement('p');
      copy.textContent = 'Görselleştirme başlatılamadı. WebGL destekleyen güncel bir tarayıcıda donanım hızlandırmayı etkinleştirin ve yeniden deneyin.';
      const detail = document.createElement('p');
      detail.className = 'startup-detail';
      detail.textContent = String(error?.message || 'Başlatma hatası');
      const retry = document.createElement('button');
      retry.textContent = 'Yeniden dene';
      retry.addEventListener('click', () => window.location.reload());
      panel.append(brand, title, copy, detail, retry);
      document.body.append(panel);
    });
  </script>
</body>
</html>
